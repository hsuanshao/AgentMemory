[package]
name = "memory-client"
description = "amem: Agent Memory client for Claude Code, Antigravity and Hermes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "amem"
path = "src/main.rs"

# Deliberately independent of the server crates: a small, fast binary that
# hooks can spawn on every prompt.
[dependencies]
regex.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
